spring:
  application:
    name: mediconnect

  # Active profile driven by env-var (docker-compose sets it to 'local')
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Application-level JWT settings (overridable per profile)
mediconnect:
  jwt:
    secret:     ${MEDICONNECT_JWT_SECRET:changeme_use_a_long_random_secret_in_prod_min_256bits}
    expiration:         ${MEDICONNECT_JWT_EXPIRATION:86400000}          # 24 h in ms
    refresh-expiration: ${MEDICONNECT_JWT_REFRESH_EXPIRATION:604800000}  # 7 days in ms

