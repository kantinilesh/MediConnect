spring:
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mediconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:mediconnect}
    password: ${SPRING_DATASOURCE_PASSWORD:mediconnect123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update   # auto-create/alter tables in local dev
    show-sql: true

logging:
  level:
    com.mediconnect: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
